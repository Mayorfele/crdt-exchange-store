[package]
name = "ingester"
version = "0.1.0"
edition = "2021"

[dependencies]
# HTTP client for hitting Frankfurter and CoinGecko APIs
reqwest = { version = "0.12", features = ["json"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# JSON deserialization of API responses
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# gRPC client to write rates into the cluster
tonic = "0.12"
prost = "0.13"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Shared types (your shared crate)
shared = { path = "../shared" }

kvstore-proto = { path = "../proto" }

clap = { version = "4", features = ["derive", "env"] }
